<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Evita que Google indexe esta página -->
    <meta name="robots" content="noindex, nofollow">

    <title>Sync Manager - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 2rem;
            width: 100%;
            max-width: 360px;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #333;
        }

        /* ---- Alertas ---- */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* ---- Formulario ---- */
        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .btn-login {
            width: 100%;
            padding: 0.6rem;
            background-color: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

<div class="login-card">

    <h1>🔒 Sync Manager</h1>

    <!-- Mensaje de éxito (logout) -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Mensaje de error (login fallido) -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Formulario de login -->
    <form th:action="@{/sync/login}" method="post">

        <!-- Token CSRF requerido por Spring Security -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Usuario"
                   autofocus
                   required/>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Contraseña"
                   required/>
        </div>

        <button type="submit" class="btn-login">Entrar</button>

    </form>

</div>

</body>
</html>
